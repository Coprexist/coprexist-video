<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;overflow:hidden;width:960px;height:540px;
  background:radial-gradient(1200px 700px at 50% 42%, #141a2e 0%, #0a0d16 62%, #070910 100%)}
body{font-family:"Noto Sans CJK SC",system-ui,sans-serif}
.panel{position:absolute;left:50%;top:50%;width:840px;transform:translate(-50%,-50%);
  border-radius:18px;border:1px solid rgba(255,255,255,.12);background:#0d1018;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(120,140,255,.07), inset 0 1px 0 rgba(255,255,255,.06);
  opacity:0}
.manim{width:100%;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 14px;font-size:13px;color:#aab0c8;
  letter-spacing:.02em;background:linear-gradient(transparent,#0d1018 55%)}
.tag{position:absolute;left:20px;top:16px;font-size:11px;color:#7c84a8;letter-spacing:.08em}
</style></head><body>
<div class="panel" id="panel">
  <img id="mf" class="manim" src="frames/0001.png" />
  <div class="tag">CONCURRENCY</div>
  <div class="cap">消息进队列 → 满员时等待 → 放行后前移</div>
</div>
<script>
const panel=document.getElementById("panel"), mf=document.getElementById("mf")
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v))
const easeOutBack=p=>{const c=1.6;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}
const TOTAL=241
window.setFrame=function(t){
  const p=clamp((t-0.15)/0.55,0,1)
  const e=easeOutBack(p)
  const bob=Math.sin(t*2.1)*3
  panel.style.opacity=clamp(p*1.7,0,1)
  panel.style.transform="translate(-50%, calc(-50% + "+((1-e)*80+bob).toFixed(2)+"px))"
  const ft=clamp(t-0.75,0,8.03)
  const f=Math.min(TOTAL,Math.floor(ft*30)+1)
  const src="frames/"+String(f).padStart(4,"0")+".png"
  if(mf.getAttribute("src")!==src) mf.setAttribute("src",src)
}
window.setFrame(0)
</script></body></html>
